openapi: "3.0.3"
info:
  title: Asistente Ciudadano — API
  description: >
    API del asistente conversacional de trámites públicos. Ver specs/03-api.md
    para reglas transversales.
  version: "1.0.0"
  contact:
    name: Equipo Asistente Ciudadano
servers:
  - url: /api/v1
paths:
  /bots:
    get:
      summary: Listar los bots de la plataforma
      operationId: listBots
      responses:
        "200":
          description: Listado de bots
          content:
            application/json:
              schema:
                type: object
                properties:
                  bots:
                    type: array
                    items: { $ref: "#/components/schemas/BotSummary" }
  /bots/{botId}:
    get:
      summary: Detalle de un bot (agentes y colecciones)
      operationId: getBot
      parameters:
        - { name: botId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Detalle del bot
          content:
            application/json:
              schema: { type: object }
        "404": { $ref: "#/components/responses/NotFound" }
  /bots/{botId}/chat:
    post:
      summary: Conversar con un bot
      operationId: botChat
      parameters:
        - { name: botId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChatRequest" }
      responses:
        "200":
          description: Respuesta del bot
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /bots/{botId}/documents:
    get:
      summary: Listar la base de conocimiento de un bot
      operationId: listDocuments
      parameters:
        - { name: botId, in: path, required: true, schema: { type: string } }
        - { name: q, in: query, required: false, schema: { type: string }, description: Filtro de texto libre }
      responses:
        "200":
          description: Listado resumido de documentos
          content:
            application/json:
              schema:
                type: object
                properties:
                  documents:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        titulo: { type: string }
                        coleccion: { type: string }
                        resumen: { type: string }
                        etiquetas: { type: array, items: { type: string } }
        "404": { $ref: "#/components/responses/NotFound" }
  /bots/{botId}/documents/{docId}:
    get:
      summary: Documento completo
      operationId: getDocument
      parameters:
        - { name: botId, in: path, required: true, schema: { type: string } }
        - { name: docId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Documento
          content:
            application/json:
              schema: { type: object }
        "404": { $ref: "#/components/responses/NotFound" }
  /chat:
    post:
      summary: Enviar un mensaje al bot por defecto (atajo)
      operationId: chat
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChatRequest" }
      responses:
        "200":
          description: Respuesta del asistente
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /feedback:
    post:
      summary: Registrar feedback sobre una respuesta
      operationId: feedback
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [helpful]
              properties:
                helpful: { type: boolean }
                comment:
                  type: string
                  maxLength: 500
      responses:
        "204": { description: Registrado }
        "400": { $ref: "#/components/responses/BadRequest" }
  /health:
    get:
      summary: Liveness
      operationId: health
      responses:
        "200":
          description: El proceso está vivo
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  version: { type: string }
  /ready:
    get:
      summary: Readiness
      operationId: ready
      responses:
        "200": { description: Listo para recibir tráfico }
        "503": { description: No listo }
components:
  responses:
    BadRequest:
      description: Entrada inválida
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Recurso inexistente
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    RateLimited:
      description: Límite de solicitudes excedido
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
    ChatRequest:
      type: object
      required: [message]
      properties:
        message: { type: string, minLength: 1, maxLength: 1000 }
        history:
          type: array
          maxItems: 20
          items:
            type: object
            required: [role, content]
            properties:
              role: { type: string, enum: [user, assistant] }
              content: { type: string, maxLength: 2000 }
    ChatResponse:
      type: object
      required: [reply, sources, agentes, mode, bot]
      properties:
        reply: { type: string }
        bot: { type: string, description: id del bot que respondió }
        mode:
          type: string
          enum: [ai, catalog]
          description: "ai = generada por el modelo sobre el contexto recuperado; catalog = extractiva del conocimiento curado (modo degradado)"
        agentes:
          type: array
          description: Agentes especialistas consultados
          items:
            type: object
            properties:
              id: { type: string }
              nombre: { type: string }
        sources:
          type: array
          description: Documentos citados como fundamento de la respuesta
          items:
            type: object
            properties:
              id: { type: string }
              nombre: { type: string }
              seccion: { type: string }
              organismo: { type: string }
              enlaceOficial: { type: string }
    BotSummary:
      type: object
      properties:
        id: { type: string }
        nombre: { type: string }
        descripcion: { type: string }
        organismo: { type: string }
        agentes:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              nombre: { type: string }
              descripcion: { type: string }
